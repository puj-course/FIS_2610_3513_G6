name: CD - Build y Despliegue con Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:ci

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Metadata de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/unimercs-app
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 5. Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Generar reporte de construccion
        run: |
          cat > reporte-docker.md << EOF
          # REPORTE DE CONSTRUCCIÓN DOCKER - UniMercs
          | Item | Valor |
          |------|-------|
          | Imagen | ghcr.io/${{ github.repository }}/unimercs-app |
          | Commit | ${{ github.sha }} |
          | Fecha | $(date -Iseconds) |
          | Branch | ${{ github.ref_name }} |

          ## Estado
          - [x] Pruebas unitarias pasadas
          - [x] Imagen Docker construida
          - [x] Imagen publicada en GHCR
          EOF

      - name: 7. Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-docker
          path: reporte-docker.md
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Levantar stack con Docker Compose
        run: |
          docker compose up -d
          echo "Esperando que MongoDB y la app arranquen (30s)..."
          sleep 30

      - name: Ver logs de la app
        run: docker compose logs app --tail 50

      - name: Verificar que /api/posts responde 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/posts || echo "000")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend responde correctamente"
          else
            echo "Backend no responde (status $STATUS)"
            docker compose logs
            exit 1
          fi

      - name: Apagar stack
        if: always()
        run: docker compose down -v
