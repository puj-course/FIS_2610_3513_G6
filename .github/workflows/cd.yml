name: CD - Build y Despliegue con Docker
on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run test:ci

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Extraer metadata para la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/unimercs-app
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 5. Build y push de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Generar reporte de construcción
        run: |
          echo "# REPORTE DE CONSTRUCCIÓN DOCKER - UniMercs" > reporte-docker.md
          echo "" >> reporte-docker.md
          echo "## Información" >> reporte-docker.md
          echo "| Item | Valor |" >> reporte-docker.md
          echo "|------|-------|" >> reporte-docker.md
          echo "| Imagen | ghcr.io/${{ github.repository }}/unimercs-app |" >> reporte-docker.md
          echo "| Commit SHA | ${{ github.sha }} |" >> reporte-docker.md
          echo "| Fecha | $(date -Iseconds) |" >> reporte-docker.md
          echo "| Branch | ${{ github.ref_name }} |" >> reporte-docker.md
          echo "" >> reporte-docker.md
          echo "## Estado" >> reporte-docker.md
          echo "- [x] Pruebas unitarias pasadas" >> reporte-docker.md
          echo "- [x] Imagen Docker construida" >> reporte-docker.md
          echo "- [x] Imagen publicada en GHCR" >> reporte-docker.md

      - name: 7. Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-docker
          path: reporte-docker.md
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Levantar stack con Docker Compose
      run: |
        docker compose up -d
        echo "Esperando que los servicios arranquen..."
        sleep 25

    - name: Verificar contenedores corriendo
      run: docker ps -a

    - name: Ver logs completos (importante)
      run: |
        echo "=== LOGS COMPLETOS DEL CONTENEDOR ==="
        docker logs unimercs-app --tail 100 2>&1

    - name: Verificar conectividad a MongoDB
      run: |
        echo "=== Verificando conexión a MongoDB ==="
        docker exec unimercs-app node -e "
          const mongoose = require('mongoose');
          mongoose.connect(process.env.MONGO_URI)
            .then(() => { console.log(' Conexión exitosa'); process.exit(0); })
            .catch(err => { console.error(' Error:', err.message); process.exit(1); });
        "

    - name: Verificar que el backend responde
      run: |
        echo "=== Probando endpoint ==="
        curl -v http://localhost:5000/api/posts
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/posts || echo "000")
        echo "HTTP Status: $STATUS"
        if [ "$STATUS" != "200" ]; then
          exit 1
        fi

    - name: Apagar stack
      if: always()
      run: docker compose down -v
