name: CI - Pruebas Unitarias y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas con cobertura
        run: npm run test:ci

      - name: Mostrar archivos de cobertura generados
        run: find . -path ./node_modules -prune -o -name "*.info" -print -o -name "coverage-summary.json" -print

      - name: Verificar cobertura en reporte
        run: |
          node -e "
            const s = require('./src/test/coverage/coverage-summary.json');
            const pct = s.total.lines.pct;
            console.log('Cobertura de lineas: ' + pct + '%');
            if (pct < 70) { console.error('ERROR: cobertura ' + pct + '% < 70%'); process.exit(1); }
            else { console.log('OK: cobertura >= 70%'); }
          "

      - name: Subir reportes como artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            src/test/reports/
            src/test/coverage/
          retention-days: 30

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar cobertura para SonarCloud
        run: npm run test:ci

      - name: Verificar que lcov.info existe
        run: |
          if [ ! -f "src/test/coverage/lcov.info" ]; then
            echo "ERROR: lcov.info no encontrado"
            exit 1
          fi
          echo "lcov.info encontrado, tamaño: $(wc -l < src/test/coverage/lcov.info) lineas"

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
