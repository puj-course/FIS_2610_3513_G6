name: CI - Pruebas Unitarias y Cobertura

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas con cobertura
        run: npm run test:ci

      - name: Verificar cobertura >= 70%
        run: |
          node -e "
            const s = require('./src/test/coverage/coverage-summary.json');
            const pct = s.total.lines.pct;
            console.log('Cobertura de lineas: ' + pct + '%');
            if (pct < 70) { console.error('ERROR: cobertura ' + pct + '% < 70%'); process.exit(1); }
            else { console.log('OK: cobertura >= 70%'); }
          "

      - name: Subir reportes como artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            src/test/reports/
            src/test/coverage/
          retention-days: 30

      - name: Notificar resultado a Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="*CI UniMercs - Pruebas OK*%0ACobertura >= 70%25%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"
          else
            MSG="*CI UniMercs - Pruebas FALLARON*%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}%0ARevisa los logs en GitHub Actions."
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" || true

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar cobertura para SonarCloud
        run: npm run test:ci

      - name: Verificar que lcov.info existe
        run: |
          if [ ! -f "src/test/coverage/lcov.info" ]; then
            echo "ERROR: lcov.info no encontrado"
            exit 1
          fi
          echo "lcov.info encontrado: $(wc -l < src/test/coverage/lcov.info) lineas"

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar resultado SonarCloud a Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="*SonarCloud UniMercs - Análisis OK*%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"
          else
            MSG="*SonarCloud UniMercs - Análisis FALLÓ*%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" || true
