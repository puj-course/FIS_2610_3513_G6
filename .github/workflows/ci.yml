name: CI - Pruebas Unitarias y Cobertura


on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas unitarias con cobertura
        run: npm run test:ci
        continue-on-error: false
      - name: Ver archivos generados
        run: |
          find . -type f | grep coverage

      - name: Verificar umbral de cobertura >70%
        shell: bash
        run: |
          COVERAGE=$(node -e "console.log(require('./src/test/coverage/coverage-summary.json').total.lines.pct)")

          echo "Cobertura de líneas: ${COVERAGE}%"

          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "ERROR: Cobertura ${COVERAGE}% < 70%"
            exit 1
          else
            echo "OK: Cobertura ${COVERAGE}% >= 70%"
          fi

      - name: Subir reportes como artefactos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            src/test/reports/
            src/test/coverage/
          retention-days: 30

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas con cobertura (para Sonar)
        run: npm run test:ci

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
