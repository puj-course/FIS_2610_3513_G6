version: '3.9'
services:
  mongodb:
    image: mongo:6
    container_name: unimercs-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - unimercs-network
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unimercs-app
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      - PORT=5000
      - MONGO_URI=mongodb://jsanchez312:uUEVNWo4y4gPFXVQ@ac-u3ruhdc-shard-00-00.0jscwio.mongodb.net:27017,ac-u3ruhdc-shard-00-01.0jscwio.mongodb.net:27017,ac-u3ruhdc-shard-00-02.0jscwio.mongodb.net:27017/?ssl=true&replicaSet=atlas-13yypb-shard-0&authSource=admin&appName=Unimercs
      - JWT_SECRET=unimercs_super_secreto_2025
      depends_on:
      - mongodb
    networks:
      - unimercs-network

volumes:
  mongodb_data:

networks:
  unimercs-network:
    driver: bridge   
