version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unimercs-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/unimercs
      - JWT_SECRET=unimercs_super_secreto_2025

networks:
  unimercs-network:
    driver: bridge
