version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unimercs-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/unimercs
      - JWT_SECRET=unimercs_super_secreto_2025
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - unimercs-network

  mongo:
    image: mongo:7.0
    container_name: unimercs-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - unimercs-network

volumes:
  mongo_data:
  uploads_data:

networks:
  unimercs-network:
    driver: bridge
